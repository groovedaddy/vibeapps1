<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Player Pong - Best of 7</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }
        h1 {
            margin: 0 0 10px 0;
            letter-spacing: 4px;
            font-size: 2rem;
        }
        canvas {
            background-color: #000000;
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .controls {
            margin-top: 15px;
            font-size: 1rem;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <h1>PONG</h1>
    <canvas id="pongCanvas" width="800" height="500"></canvas>
    <div class="controls">
        You (Left): <strong>W / S</strong> or <strong>Up / Down Arrows</strong> &nbsp;|&nbsp; First to <strong>4</strong> Wins (Best of 7)
    </div>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Game settings
        const paddleWidth = 12;
        const paddleHeight = 90;
        const ballRadius = 8;
        const playerSpeed = 7;
        const botSpeed = 5.2;
        const winningScore = 4; // Best of 7 (first to 4 points)

        let gameOver = false;
        let winnerText = "";

        // Player paddle (Left)
        const player = {
            x: 15,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0
        };

        // Bot paddle (Right)
        const bot = {
            x: canvas.width - paddleWidth - 15,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0
        };

        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: ballRadius,
            speed: 6,
            dx: 6,
            dy: 2.5
        };

        // Keyboard state
        const keys = {
            ArrowUp: false,
            ArrowDown: false,
            w: false,
            s: false
        };

        // Listen for key presses
        window.addEventListener("keydown", (e) => {
            if (e.key in keys) keys[e.key] = true;
            if (e.key === "W") keys.w = true;
            if (e.key === "S") keys.s = true;

            if (gameOver && (e.key === " " || e.key === "Enter")) {
                resetMatch();
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.key in keys) keys[e.key] = false;
            if (e.key === "W") keys.w = false;
            if (e.key === "S") keys.s = false;
        });

        function resetBall(serveDirection = 1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 6;

            // Keep serve angle between -30 and +30 degrees so it doesn't immediately hug the wall
            const angle = (Math.random() * (Math.PI / 3)) - (Math.PI / 6);
            ball.dx = serveDirection * ball.speed * Math.cos(angle);
            ball.dy = ball.speed * Math.sin(angle);
        }

        function resetMatch() {
            player.score = 0;
            bot.score = 0;
            player.y = canvas.height / 2 - paddleHeight / 2;
            bot.y = canvas.height / 2 - paddleHeight / 2;
            gameOver = false;
            winnerText = "";
            resetBall(Math.random() > 0.5 ? 1 : -1);
        }

        function checkWinner() {
            if (player.score >= winningScore) {
                gameOver = true;
                winnerText = "YOU WIN THE MATCH!";
            } else if (bot.score >= winningScore) {
                gameOver = true;
                winnerText = "BOT WINS THE MATCH!";
            }
        }

        function update() {
            if (gameOver) return;

            // 1. Move Player Paddle
            if (keys.w || keys.ArrowUp) {
                player.y -= playerSpeed;
            }
            if (keys.s || keys.ArrowDown) {
                player.y += playerSpeed;
            }
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // 2. Move Bot Paddle (AI)
            const botCenter = bot.y + bot.height / 2;
            if (ball.dx > 0) {
                if (botCenter < ball.y - 12) {
                    bot.y += botSpeed;
                } else if (botCenter > ball.y + 12) {
                    bot.y -= botSpeed;
                }
            } else {
                if (botCenter < canvas.height / 2 - 10) {
                    bot.y += botSpeed * 0.4;
                } else if (botCenter > canvas.height / 2 + 10) {
                    bot.y -= botSpeed * 0.4;
                }
            }
            bot.y = Math.max(0, Math.min(canvas.height - bot.height, bot.y));

            // 3. Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Top and bottom wall bounce with position clamping to prevent wall clipping
            if (ball.y - ball.radius <= 0) {
                ball.y = ball.radius;
                ball.dy = Math.abs(ball.dy);
            } else if (ball.y + ball.radius >= canvas.height) {
                ball.y = canvas.height - ball.radius;
                ball.dy = -Math.abs(ball.dy);
            }

            // Paddle collision detection with horizontal clamping
            let activePaddle = ball.x < canvas.width / 2 ? player : bot;
            if (
                ball.x - ball.radius < activePaddle.x + activePaddle.width &&
                ball.x + ball.radius > activePaddle.x &&
                ball.y + ball.radius > activePaddle.y &&
                ball.y - ball.radius < activePaddle.y + activePaddle.height
            ) {
                let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
                collidePoint = collidePoint / (activePaddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;

                let direction = ball.x < canvas.width / 2 ? 1 : -1;
                ball.speed = Math.min(ball.speed + 0.4, 14);
                ball.dx = direction * ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);

                // Push ball cleanly outside the paddle to avoid double-hits
                if (direction === 1) {
                    ball.x = activePaddle.x + activePaddle.width + ball.radius;
                } else {
                    ball.x = activePaddle.x - ball.radius;
                }
            }

            // Scoring
            if (ball.x - ball.radius < 0) {
                bot.score++;
                checkWinner();
                if (!gameOver) resetBall(-1);
            } else if (ball.x + ball.radius > canvas.width) {
                player.score++;
                checkWinner();
                if (!gameOver) resetBall(1);
            }
        }

        function draw() {
            // Clear screen
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw center dashed net
            ctx.strokeStyle = "#444444";
            ctx.lineWidth = 4;
            ctx.setLineDash([12, 12]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw scores
            ctx.fillStyle = "#ffffff";
            ctx.font = "48px 'Courier New', monospace";
            ctx.textAlign = "center";
            ctx.fillText(player.score, canvas.width / 4, 65);
            ctx.fillText(bot.score, (canvas.width * 3) / 4, 65);

            // Draw paddles
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(bot.x, bot.y, bot.width, bot.height);

            // Draw ball (only while match is active)
            if (!gameOver) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Draw Game Over overlay
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 40px 'Courier New', monospace";
                ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 15);

                ctx.font = "20px 'Courier New', monospace";
                ctx.fillStyle = "#aaaaaa";
                ctx.fillText("Press SPACE or ENTER to play again", canvas.width / 2, canvas.height / 2 + 30);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game with a clean opening serve
        resetBall(Math.random() > 0.5 ? 1 : -1);
        gameLoop();
    </script>
</body>
</html>
